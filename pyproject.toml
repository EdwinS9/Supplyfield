[project]
name = "gtl"
version = "0.1.0"
description = "Agents that keep a supply chain running, and the Gym they train in"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "scipy>=1.13",
    "openpyxl>=3.1",
    "pypdf>=5",
    "openai>=3.57.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3"]

[project.scripts]
soony-api = "soony_api.cli:main"
gtl = "gtl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soony_api", "src/gtl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: needs more than about 5 seconds; tools/check skips it, tools/check --all runs it"]

[tool.vercel]
entrypoint = "dashboard.app:app"
